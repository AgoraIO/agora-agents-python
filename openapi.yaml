components:
  schemas:
    AgentDeleteResponse:
      properties:
        deleted:
          type: boolean
          const: true
          title: Deleted
      additionalProperties: false
      type: object
      required:
      - deleted
      title: AgentDeleteResponse
    AgentListData:
      properties:
        count:
          type: integer
          minimum: 0.0
          title: Count
        list:
          items:
            "$ref": "#/components/schemas/AgentListItem"
          type: array
          title: List
      additionalProperties: false
      type: object
      required:
      - count
      - list
      title: AgentListData
    AgentListItem:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        agent_name:
          type: string
          title: Agent Name
        create_ts:
          type: integer
          minimum: 0.0
          title: Create Ts
        update_ts:
          type: integer
          minimum: 0.0
          title: Update Ts
      additionalProperties: false
      type: object
      required:
      - agent_id
      - agent_name
      - create_ts
      - update_ts
      title: AgentListItem
    AgentListResponse:
      properties:
        data:
          "$ref": "#/components/schemas/AgentListData"
        has_more:
          type: boolean
          title: Has More
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      additionalProperties: false
      type: object
      required:
      - data
      - has_more
      - next_cursor
      title: AgentListResponse
    AgentResponse:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        create_ts:
          type: integer
          minimum: 0.0
          title: Create Ts
        update_ts:
          type: integer
          minimum: 0.0
          title: Update Ts
        agent_name:
          type: string
          title: Agent Name
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        messages:
          anyOf:
          - items:
              "$ref": "#/components/schemas/Message"
            type: array
          - type: 'null'
          title: Messages
        greeting:
          anyOf:
          - oneOf:
            - "$ref": "#/components/schemas/TextGreeting"
            - "$ref": "#/components/schemas/AudioGreeting"
            discriminator:
              propertyName: mode
              mapping:
                audio: "#/components/schemas/AudioGreeting"
                text: "#/components/schemas/TextGreeting"
          - type: 'null'
          title: Greeting
        variables:
          anyOf:
          - patternProperties:
              "^[a-z][a-z0-9_]{0,63}$":
                "$ref": "#/components/schemas/VariableDefinition"
            type: object
          - type: 'null'
          title: Variables
        pipeline:
          anyOf:
          - "$ref": "#/components/schemas/ResolvedCascadedPipeline"
          - type: 'null'
        filler_words:
          anyOf:
          - "$ref": "#/components/schemas/FillerWords"
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - agent_id
      - create_ts
      - update_ts
      - agent_name
      title: AgentResponse
    AsrInput:
      allOf:
      - if:
          properties:
            url:
              type: string
          required:
          - url
        then:
          properties:
            credential:
              properties:
                mode:
                  const: byok
              type: object
              required:
              - mode
          required:
          - credential
      - if:
          allOf:
          - properties:
              vendor:
                enum:
                - amazon
            required:
            - vendor
          - properties:
              credential:
                properties:
                  mode:
                    const: byok
                type: object
                required:
                - mode
            required:
            - credential
        then:
          properties:
            credential:
              anyOf:
              - properties:
                  fields:
                    properties:
                      access_key_id:
                        type: string
                        minLength: 1
                      secret_access_key:
                        type: string
                        minLength: 1
                    additionalProperties: false
                    type: object
                    required:
                    - access_key_id
                    - secret_access_key
                required:
                - fields
      - if:
          allOf:
          - anyOf:
            - properties:
                vendor:
                  enum:
                  - assemblyai
                  - deepgram
                  - gemini
                  - openai
                  - sarvam
                  - smallestai
                  - xai
              required:
              - vendor
            - not:
                required:
                - vendor
            - properties:
                vendor:
                  not:
                    enum:
                    - amazon
                    - ares
                    - assemblyai
                    - deepgram
                    - gemini
                    - google
                    - microsoft
                    - openai
                    - sarvam
