          type: boolean
          title: On Ai Assistant
          default: false
        on_fax:
          type: boolean
          title: On Fax
          default: false
      additionalProperties: false
      type: object
      title: EndCallPolicy
    SessionAnalysis:
      properties:
        status:
          type: string
          enum:
          - pending
          - completed
          - failed
          - skipped
          title: Status
        skip_reason:
          anyOf:
          - type: string
            enum:
            - no_user_turns
            - retention_none
          - type: 'null'
          title: Skip Reason
        complete_ts:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Complete Ts
        result:
          anyOf:
          - patternProperties:
              "^[a-z][a-z0-9_]{0,63}$":
                anyOf:
                - type: string
                - type: integer
                - type: number
                - type: boolean
                - type: 'null'
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      additionalProperties: false
      type: object
      required:
      - status
      - skip_reason
      - complete_ts
      - result
      - error
      title: SessionAnalysis
  securitySchemes:
    AgoraTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'An Agora AccessToken2 token. Platform session routes require the
        ConvoAI service (service type 9); an RTC + RTM token alone is insufficient.
        Use a dedicated ConvoAI token builder. Send the complete header value: agora
        token=<token>. SDKs accept a supplied token or generate one from App ID and
        App Certificate; Customer ID/Customer Secret authentication is not exposed.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[\\x21-\\x7E]+$"
      description: 'Optional idempotency key. The server retains each key for 24 hours.
        Repeating the same request with the same key and body returns the first response
        without performing the operation again, with Idempotent-Replayed: true. Reusing
        a key with a different body, or while the original request is still in progress,
        returns 409 IdempotencyKeyConflict. If validation rejects a request before
        the operation starts, correct the request and reuse the same key. If the operation
        was accepted or its outcome is unknown, keep the same key; using a new key
        can start a second operation. This header is supported only for session starts
        and campaign creation/pause/resume/cancel, not agent, secret, or number creation.'
      example: 6f1c2b0e-support-4821
  headers:
    IdempotentReplayed:
      description: Present with value true when this response replays the original
        response for the same idempotency key and body within the 24-hour retention
        period.
      schema:
        type: boolean
        const: true
      example: true
servers:
- url: https://preview.ai.agora.io
  description: Agora Conversational AI API
security:
- AgoraTokenAuth: []
