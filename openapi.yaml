          properties:
            credential:
              anyOf:
              - properties:
                  fields:
                    properties:
                      aws_access_key_id:
                        type: string
                        minLength: 1
                      aws_secret_access_key:
                        type: string
                        minLength: 1
                    additionalProperties: false
                    type: object
                    required:
                    - aws_access_key_id
                    - aws_secret_access_key
                required:
                - fields
      - if:
          allOf:
          - anyOf:
            - properties:
                vendor:
                  enum:
                  - cartesia
                  - deepgram
                  - fishaudio
                  - gemini
                  - generic_http
                  - gradium
                  - mistral
                  - murf
                  - openai
                  - rime
                  - smallestai
                  - typecast
                  - xai
              required:
              - vendor
            - not:
                required:
                - vendor
            - properties:
                vendor:
                  not:
                    enum:
                    - amazon
                    - cartesia
                    - deepgram
                    - elevenlabs
                    - fishaudio
                    - gemini
                    - generic_http
                    - google
                    - gradium
                    - humeai
                    - microsoft
                    - minimax
                    - mistral
                    - murf
                    - openai
                    - rime
                    - sarvam
                    - smallestai
                    - typecast
                    - xai
          - properties:
              credential:
                properties:
                  mode:
                    const: byok
                type: object
                required:
                - mode
            required:
            - credential
        then:
          properties:
            credential:
              anyOf:
              - properties:
                  fields:
                    properties:
                      api_key:
                        type: string
                        minLength: 1
                    additionalProperties: false
                    type: object
                    required:
                    - api_key
                required:
                - fields
      - if:
          allOf:
          - properties:
              vendor:
                enum:
                - elevenlabs
                - humeai
                - microsoft
                - minimax
            required:
            - vendor
          - properties:
              credential:
                properties:
                  mode:
                    const: byok
                type: object
                required:
                - mode
            required:
            - credential
        then:
          properties:
            credential:
              anyOf:
              - properties:
                  fields:
                    properties:
                      key:
                        type: string
                        minLength: 1
                    additionalProperties: false
                    type: object
                    required:
                    - key
                required:
                - fields
      - if:
          allOf:
          - properties:
              vendor:
                enum:
                - google
            required:
            - vendor
          - properties:
              credential:
                properties:
                  mode:
                    const: byok
                type: object
                required:
                - mode
            required:
            - credential
        then:
          properties:
            credential:
              anyOf:
              - properties:
                  fields:
                    properties:
                      credentials:
                        type: string
                        minLength: 1
                    additionalProperties: false
                    type: object
                    required:
                    - credentials
                required:
                - fields
      - if:
          allOf:
          - properties:
              vendor:
                enum:
                - sarvam
            required:
            - vendor
          - properties:
              credential:
                properties:
                  mode:
                    const: byok
                type: object
                required:
                - mode
            required:
            - credential
        then:
          properties:
            credential:
              anyOf:
              - properties:
                  fields:
                    properties:
                      api_subscription_key:
                        type: string
                        minLength: 1
                    additionalProperties: false
                    type: object
                    required:
                    - api_subscription_key
                required:
                - fields
      properties:
        skip_patterns:
          anyOf:
          - items:
              "$ref": "#/components/schemas/SkipPattern"
            type: array
          - type: 'null'
          uniqueItems: true
          title: Skip Patterns
        credential:
          anyOf:
          - oneOf:
            - "$ref": "#/components/schemas/ManagedCredential"
            - "$ref": "#/components/schemas/PublicByokCredential"
            discriminator:
