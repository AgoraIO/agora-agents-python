      tags:
      - agents
      summary: List Agents
      operationId: list_agents_conversational_ai_v3_projects__appid__agents_get
      parameters:
      - name: appid
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Appid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Cursor
      - name: order
        in: query
        required: false
        schema:
          enum:
          - create_ts.desc
          - create_ts.asc
          type: string
          default: create_ts.desc
          title: Order
