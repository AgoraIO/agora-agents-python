  "/conversational-ai/v1/projects/{appid}/sessions":
    post:
      tags:
      - Sessions
      summary: Create Session
      operationId: create_session_conversational_ai_v3_projects__appid__sessions_post
      parameters:
      - name: appid
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Appid
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SessionCreate"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionStartResponse"
          headers:
            Idempotent-Replayed:
              "$ref": "#/components/headers/IdempotentReplayed"
        '409':
          description: 'TaskConflict: an agent already runs with the same RTC channel
            and UID. IdempotencyKeyConflict: the key was used with a different body
            or its original request is still in progress. A completed request repeated
            with the same key and body replays its original response for 24 hours.'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                TaskConflict:
                  value:
                    detail: An agent is already running with the same channel and
                      UID.
                    reason: TaskConflict
                IdempotencyKeyConflict:
                  summary: Key reused with a different body
                  value:
                    detail: The Idempotency-Key is bound to a request with a different
                      body.
                    reason: IdempotencyKeyConflict
                IdempotencyRequestInProgress:
                  summary: Original request is still in progress
                  value:
                    detail: A request with this Idempotency-Key is still in progress.
                    reason: IdempotencyKeyConflict
        4XX:
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: Client Error
        5XX:
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: Server Error
    get:
      tags:
      - Sessions
      summary: List Sessions
      operationId: list_sessions_conversational_ai_v3_projects__appid__sessions_get
