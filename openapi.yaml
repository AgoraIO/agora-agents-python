      allOf:
      - if:
          properties:
            url:
              type: string
          required:
          - url
        then:
          properties:
            credential:
              properties:
                mode:
                  const: byok
              type: object
              required:
              - mode
          required:
          - credential
      - if:
          allOf:
          - properties:
              vendor:
                enum:
                - amazon
            required:
            - vendor
          - properties:
              credential:
                properties:
                  mode:
                    const: byok
                type: object
                required:
                - mode
            required:
            - credential
