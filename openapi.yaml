          minLength: 1
          maxLength: 100
          title: Appid
      - name: channel
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: RUNNING
          title: Status
      - name: started_after
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Started After
      - name: started_before
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Started Before
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
